# Render Blueprint spec: https://render.com/docs/blueprint-spec
# Schema: https://render.com/schema/render.yaml.json
version: "1"

services:
  - type: web
    name: react-and-express-mono-server
    runtime: node
    rootDir: node/v24/base/client-server-arch/react-and-express-mono
    region: oregon
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthcheck
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - apps/server/**

  - type: web
    name: react-and-express-mono-client
    runtime: static
    rootDir: node/v24/base/client-server-arch/react-and-express-mono
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: react-and-express-mono-server
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - apps/client/**
